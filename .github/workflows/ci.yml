name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

env:
  IMAGE: ghcr.io/aurmartin/splitzy

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout project repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 📦 Setup Node + PNPM + install deps
        uses: ./.github/actions/setup-node-pnpm-install

      - name: 📦 Setup env file
        run: |
          echo "SERVER_URL=http://localhost:50000" > .env.test
          echo "SUPABASE_URL=http://localhost:50001" >> .env.test
          echo "SUPABASE_ANON_KEY=TEST_KEY" >> .env.test

      - name: 🏃‍♂️ Run Tests
        run: pnpm test:ci

      - name: 📦 Upload Coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout project repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 📦 Setup Node + PNPM + install deps
        uses: ./.github/actions/setup-node-pnpm-install

      - name: 🗄️ Start Supabase
        run: pnpm db:start

      - name: 📦 Setup env file
        run: |
          STATUS=$(pnpm exec supabase status -o json 2>/dev/null)
          API_URL=$(echo "$STATUS" | jq -er .API_URL)
          ANON_KEY=$(echo "$STATUS" | jq -er .ANON_KEY)
          SERVICE_ROLE_KEY=$(echo "$STATUS" | jq -er .SERVICE_ROLE_KEY)
          echo "SERVER_URL=http://localhost:50000" > .env.integration
          echo "SUPABASE_URL=$API_URL" >> .env.integration
          echo "SUPABASE_ANON_KEY=$ANON_KEY" >> .env.integration
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> .env.integration

      - name: 🏃‍♂️ Run Integration Tests
        run: pnpm test:integration

  type-check:
    name: Type Check (tsc)
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout project repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 📦 Setup Node + PNPM + install deps
        uses: ./.github/actions/setup-node-pnpm-install

      - name: 🏃‍♂️ Run TypeScript Commit
        run: pnpm tsc --noemit

  lint:
    name: Lint (eslint, prettier)
    runs-on: ubuntu-latest
    steps:
      - name: 📦 Checkout project repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 📦 Setup Node + PNPM + install deps
        uses: ./.github/actions/setup-node-pnpm-install

      - name: 🏃‍♂️ Run ESLint
        run: pnpm run lint

  build-server:
    name: Build Server
    needs: [test, type-check, lint]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: 📦 Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 🏗️ Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: 🔑 Login to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./server
          push: true
          tags: |
            ghcr.io/aurmartin/splitzy:${{ github.ref_name }}
            ghcr.io/aurmartin/splitzy:latest
