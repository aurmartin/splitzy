name: Expo SDK dependencies

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  fix:
    name: Align Expo SDK dependencies
    runs-on: ubuntu-latest
    env:
      SERVER_URL: http://localhost:50000
      SUPABASE_URL: http://localhost:50001
      SUPABASE_ANON_KEY: TEST_KEY
    steps:
      - name: 📦 Checkout project repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: 📦 Setup Node + PNPM + install deps
        uses: ./.github/actions/setup-node-pnpm-install

      - name: 🔧 Align dependencies with the Expo SDK
        run: npx expo install --fix

      # Pull requests opened with GITHUB_TOKEN don't trigger the CI workflow,
      # so the checks run here instead and fail the job after the PR is opened.
      - name: 🏃‍♂️ Run TypeScript Check
        id: tsc
        continue-on-error: true
        run: pnpm tsc --noemit

      - name: 🏃‍♂️ Run Tests
        id: tests
        continue-on-error: true
        run: |
          echo "SERVER_URL=$SERVER_URL" > .env.test
          echo "SUPABASE_URL=$SUPABASE_URL" >> .env.test
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> .env.test
          pnpm test:ci

      - name: 🚀 Open pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          branch: expo-sdk-dependencies
          delete-branch: true
          add-paths: |
            package.json
            pnpm-lock.yaml
          commit-message: "build(deps): align expo sdk dependencies"
          title: "build(deps): align expo sdk dependencies"
          body: |
            Updates generated by `npx expo install --fix`.

            TypeScript: ${{ steps.tsc.outcome }}
            Tests: ${{ steps.tests.outcome }}

      - name: ❌ Fail if checks failed
        if: steps.tsc.outcome == 'failure' || steps.tests.outcome == 'failure'
        run: exit 1
