version: 2

updates:
  # Mobile app (Expo)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
      include: scope
    ignore:
      # Major updates are done by hand.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Versions managed by the Expo SDK are aligned by the
      # expo-sdk-dependencies workflow (`npx expo install --fix`).
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/metro-runtime"
      - dependency-name: "@expo/vector-icons"
      - dependency-name: "jest-expo"
      - dependency-name: "eslint-config-expo"
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-reanimated"
      - dependency-name: "react-native-safe-area-context"
      - dependency-name: "react-native-screens"
      - dependency-name: "react-native-web"
      - dependency-name: "react-native-worklets"
      - dependency-name: "@react-native-community/netinfo"
      - dependency-name: "@sentry/react-native"
      # Must stay on the same minor as react.
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-minor"]
    groups:
      app-dependencies:
        patterns: ["*"]

  # Server
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
      include: scope
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      server-dependencies:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /server
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
      include: scope
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # CI
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ["*"]
