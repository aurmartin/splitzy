version: 2

# All version updates land in a single weekly pull request.
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: build
      include: scope

updates:
  # Mobile app (Expo)
  - package-ecosystem: npm
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: dependencies
    ignore:
      # These versions are pinned by the Expo SDK: upgrade them with
      # `npx expo install --fix` as part of an SDK upgrade instead.
      - dependency-name: "expo"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "expo-*"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@expo/*"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "jest-expo"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "eslint-config-expo"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-dom"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@types/react"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native-reanimated"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native-worklets"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native-safe-area-context"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native-screens"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native-web"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@react-native-community/netinfo"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@sentry/react-native"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "typescript"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]

  # Server
  - package-ecosystem: npm
    directory: /server
    patterns: ["*"]
    multi-ecosystem-group: dependencies

  - package-ecosystem: docker
    directory: /server
    patterns: ["*"]
    multi-ecosystem-group: dependencies

  # CI
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    patterns: ["*"]
    multi-ecosystem-group: dependencies
